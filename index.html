  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const cfg = {
    apiKey:"AIzaSyAuhNZWVRjlbkLiifsaZ7-ITXipLiYKqLE",
    authDomain:"mahaucrm.firebaseapp.com",
    projectId:"mahaucrm",
    storageBucket:"mahaucrm.firebasestorage.app",
    messagingSenderId:"733047479660",
    appId:"1:733047479660:web:f02a4876f4015882d42749"
  };
  const app = initializeApp(cfg);
  const db = getFirestore(app);
  const REF = doc(db, "mahau", "crm");
  const CHUNK=5000;
  window._db = {
    load: async () => { try { const s=await getDoc(REF); return s.exists()?s.data():null; } catch { return null; } },
    save: async (d) => { try { await setDoc(REF,d); return true; } catch { return false; } },
    saveBday: async (contacts) => {
      try {
        const n=Math.max(1,Math.ceil(contacts.length/CHUNK));
        for(let i=0;i<n;i++){
          const chunk=contacts.slice(i*CHUNK,(i+1)*CHUNK);
          await setDoc(doc(db,"mahau","bday_"+i),{contacts:chunk,chunk:i,total:n});
        }
        // Store metadata with total chunks
        await setDoc(doc(db,"mahau","bday_meta"),{totalChunks:n,count:contacts.length});
        return true;
      } catch(e){console.error("saveBday",e);return false;}
    },
    loadBday: async () => {
      try {
        const meta=await getDoc(doc(db,"mahau","bday_meta"));
        if(!meta.exists())return [];
        const n=meta.data().totalChunks||1;
        const all=[];
        for(let i=0;i<n;i++){
          const s=await getDoc(doc(db,"mahau","bday_"+i));
          if(s.exists())all.push(...(s.data().contacts||[]));
        }
        return all;
      } catch(e){console.error("loadBday",e);return [];}
    },
    sub: (cb) => onSnapshot(REF, s=>{ if(s.exists()) cb(s.data()); }),
    subBday: (cb) => { /* real-time not used for large bday base */ return ()=>{}; }
  };
  window._dbReady = true;
  window.dispatchEvent(new Event("dbReady"));
</script>

const fmtDate = d => { try{return d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";}catch{return"—";} };
const dowOf = d => { try{return DAYS[new Date(d+"T12:00:00").getDay()];}catch{return"?";} };
const dAgo = d => { try{return d?Math.floor((Date.now()-new Date(d+"T12:00:00").getTime())/86400000):9999;}catch{return 9999;} };

function autoEvent(dateStr){
  if(!dateStr)return"";
  const day=new Date(dateStr+"T12:00:00").getDay(); // 0=Dom,4=Qui,5=Sex,6=Sab
  if(day===4||day===0)return"Funk";

}

function normAmt(v){
  if(!v)return 0;
  if(typeof v==="number")return Math.round(v*100)/100;
  return parseFloat(String(v).replace(/R\$/gi,"").replace(/\u00a0/g,"").replace(/\s/g,"").replace(/\./g,"").replace(",","."))||0;
}
function normPhone(v){return!v?"":String(v).replace(/[^\d\+\(\)\-\s]/g,"").trim();}
function normBday(v){
  if(!v)return "";
  // Excel serial date number
  if(typeof v==="number"&&v>1000&&v<200000){
    try{const d=new Date(Math.round((v-25569)*86400000));return String(d.getUTCDate()).padStart(2,"0")+"/"+String(d.getUTCMonth()+1).padStart(2,"0");}catch{}
  }
  const s=String(v).trim();
  // DD/MM/YYYY or DD/MM/YY or DD/MM
  const m1=s.match(/^(\d{1,2})[\/\-\.](\d{1,2})(?:[\/\-\.](\d{2,4}))?$/);
  if(m1)return m1[1].padStart(2,"0")+"/"+m1[2].padStart(2,"0");
  // YYYY-MM-DD
  const m2=s.match(/^\d{4}-(\d{2})-(\d{2})/);
  if(m2)return m2[2]+"/"+m2[1];
  // Try JS Date parse as fallback
  try{const d=new Date(s);if(!isNaN(d))return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");}catch{}
  return "";
}
function fmtBday(b){if(!b)return"—";const p=b.split("/");return p.length===2?p[0]+"/"+p[1]:b;}
function bdayMonth(b){if(!b)return-1;const p=b.split("/");return p.length>=2?parseInt(p[1])-1:-1;}
function bdayDay(b){if(!b)return-1;return parseInt((b.split("/")[0])||"-1");}
function dUntilBday(b){
  if(!b)return 9999;
  try{
    const now=new Date();const p=b.split("/");
    const day=parseInt(p[0]),month=parseInt(p[1])-1;
    let next=new Date(now.getFullYear(),month,day);
    if(next<now)next=new Date(now.getFullYear()+1,month,day);
    return Math.floor((next-now)/86400000);
  }catch{return 9999;}
}

// ─── RFM ─────────────────────────────────────────────────────────────────────
function rfmExplain(R,F,M,count,last,total,segment,avgTicket,vis30){
  const away=dAgo(last);
  const motivos=[];

  if(segment==="VIP"){
    motivos.push("ticket médio de "+fmt(avgTicket)+" por visita — acima de R$ 1.000");
    motivos.push(count+" visita"+(count!==1?"s":"")+" registrada"+(count!==1?"s":""));
    if(away<=14)motivos.push("veio nos últimos 14 dias");
    else motivos.push("última visita há "+away+" dias");
  } else if(segment==="Fiel"){
    motivos.push(vis30+" visita"+(vis30!==1?"s":"")+" nos últimos 30 dias — frequência alta");
    motivos.push("última visita há "+away+" dias");
    motivos.push(count+" visita"+(count!==1?"s":"")+" no total");
  } else if(segment==="Potencial"){
    motivos.push("veio recentemente — há "+away+" dias");
    motivos.push(count+" visita"+(count!==1?"s":"")+" apenas — ainda está no início");
    motivos.push("ainda não criou hábito de retorno");
  } else if(segment==="Em Risco"){
    motivos.push("sumiu há "+away+" dias — era frequente");
    motivos.push(count+" visita"+(count!==1?"s":"")+" no histórico — cliente conhecido");
    motivos.push("momento crítico: janela de recuperação ainda aberta");
  } else {
    motivos.push("última visita há "+away+" dias");
    motivos.push(count+" visita"+(count!==1?"s":"")+" no total — baixo engajamento");
    if(avgTicket<50)motivos.push("consumo muito baixo ou zero");
  }

  const acao={
    VIP:"Relacionamento personalizado. Avisa antes dos eventos especiais, reserva mesa, trata pelo nome. Não pode sumir.",
    Fiel:"Reconhece a presença. Um gesto simples — uma mensagem, um brinde — cria lealdade longa.",
    Potencial:"Momento de criar o hábito. Convida pro próximo evento, facilita o retorno enquanto ainda tá quente.",
    "Em Risco":"Chama agora. Uma mensagem direta, sem enrolação. Pergunta se vai no próximo evento. Não deixa passar mais tempo.",
    Perdido:"Deixa quieto. Não é telemarketing. Se voltar por conta própria, acolhe bem."
  };

  return{motivos,acao};
}
// RFM recalculated based on Mahau Bar logic
// VIP: avg ticket > R$1000
// Fiel: 3+ visits in last 30 days AND visited recently
// Potencial: visited recently (last 30 days) but < 3 visits total
// Em Risco: was frequent but gone 14+ days
// Perdido: everything else
function rfmSegMahau(avgTicket, visitsLast30, totalVisits, daysAway){
  if(avgTicket>=1000)return{segment:"VIP",color:"#b8860b"};
  if(visitsLast30>=3&&daysAway<=30)return{segment:"Fiel",color:"#2a6a3a"};
  if(daysAway<=30&&totalVisits<3)return{segment:"Potencial",color:"#1a3a6a"};
  if(totalVisits>=3&&daysAway>14)return{segment:"Em Risco",color:"#6a3a10"};
  return{segment:"Perdido",color:"#5a2020"};
}
function rfmSeg(R,F,M){
  // kept for legacy, not used directly anymore
  return{segment:"Perdido",color:"#5a2020"};
}
function computeRFM(customers,visits){
  if(!customers?.length)return[];
  const cut30=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  return customers.map(c=>{
    const vs=visits.filter(v=>v.cid===c.id);
    if(!vs.length){const sg=rfmSegMahau(0,0,0,9999);return{...c,R:1,F:1,M:1,avg:1,...sg,total:0,count:0,last:null,avgTicket:0,vis30:0};}
    const sorted=vs.slice().sort((a,b)=>b.date.localeCompare(a.date));
    const last=sorted[0].date;
    const total=vs.reduce((s,v)=>s+v.amount,0);
    const avgTicket=total/vs.length;
    const vis30=vs.filter(v=>v.date>=cut30).length;
    const away=dAgo(last);
    const sg=rfmSegMahau(avgTicket,vis30,vs.length,away);
    // Keep R,F,M for display purposes
    const R=away<=14?5:away<=30?4:away<=60?3:away<=90?2:1;
    const F=vs.length>=5?5:vs.length>=4?4:vs.length>=3?3:vs.length>=2?2:1;
    const M=avgTicket>=1000?5:avgTicket>=500?4:avgTicket>=200?3:avgTicket>=50?2:1;
    return{...c,R,F,M,avg:(R+F+M)/3,...sg,total,count:vs.length,last,avgTicket,vis30};
  }).sort((a,b)=>b.avg-a.avg);
}

// ─── Analysis ─────────────────────────────────────────────────────────────────
function analyze(customers,visits,days){
  const cut=new Date(Date.now()-days*86400000).toISOString().slice(0,10);
  const prev=new Date(Date.now()-days*2*86400000).toISOString().slice(0,10);
  const inP=visits.filter(v=>v.date>=cut);
  const prevP=visits.filter(v=>v.date>=prev&&v.date<cut);
  const revP=inP.reduce((s,v)=>s+v.amount,0);
  const revPrev=prevP.reduce((s,v)=>s+v.amount,0);
  const growth=revPrev>0?(((revP-revPrev)/revPrev)*100).toFixed(1):null;
  const tk=inP.length?revP/inP.length:0;
  const cIn={};inP.forEach(v=>{cIn[v.cid]=true;});
  const cPrev={};prevP.forEach(v=>{cPrev[v.cid]=true;});
  const ids=Object.keys(cIn);
  const newC=ids.filter(id=>{const all=visits.filter(v=>v.cid===id).sort((a,b)=>a.date.localeCompare(b.date));return all.length>0&&all[0].date>=cut;});
  const ret=ids.filter(id=>cPrev[id]);
  const churned=customers.filter(c=>!cIn[c.id]&&visits.some(v=>v.cid===c.id&&v.date<cut))
    .map(c=>{const vs=visits.filter(v=>v.cid===c.id);const last=vs.sort((a,b)=>b.date.localeCompare(a.date))[0];const tot=vs.reduce((s,v)=>s+v.amount,0);return{name:c.name,phone:c.phone||"",last:last?last.date:null,away:last?dAgo(last.date):999,tot,count:vs.length};})
    .sort((a,b)=>b.tot-a.tot).slice(0,12);
  const top=ids.map(id=>{const c=customers.find(x=>x.id===id);const vs=inP.filter(v=>v.cid===id);const tot=vs.reduce((s,v)=>s+v.amount,0);return{name:c?c.name:"?",count:vs.length,tot,tk:vs.length?tot/vs.length:0};}).sort((a,b)=>b.tot-a.tot).slice(0,30);
  const byDay={};DAYS.forEach(d=>{byDay[d]={v:0,r:0};});inP.forEach(v=>{const d=dowOf(v.date);if(byDay[d]){byDay[d].v++;byDay[d].r+=v.amount;}});
  const dayStats=Object.entries(byDay).filter(e=>e[1].v>0).sort((a,b)=>b[1].r-a[1].r);
  const styles={};customers.forEach(c=>{if(c.style)styles[c.style]=(styles[c.style]||0)+1;});
  const bdays=customers.filter(c=>dUntilBday(c.bday)<=30&&c.bday).map(c=>c.name+" ("+fmtBday(c.bday)+")");
  const lines=[];
  lines.push("📊 RESUMO — "+days+" dias");
  lines.push(ids.length+" clientes únicos · "+inP.length+" visitas · "+fmt(revP)+" · tk "+fmt(tk));
  lines.push(newC.length+" novos · "+ret.length+" retornando · "+churned.length+" em risco");
  if(growth!==null)lines.push("Crescimento vs período anterior: "+(growth>0?"+":"")+growth+"%");
  lines.push("");
  if(top.length){lines.push("👑 TOP CLIENTES");top.forEach((c,i)=>lines.push((i+1)+". "+c.name+": "+c.count+"x, "+fmt(c.tot)));lines.push("");}
  if(dayStats.length){lines.push("📅 DIAS");dayStats.forEach(([d,x])=>lines.push(d+": "+x.v+" visitas, "+fmt(x.r)));lines.push("");}
  if(Object.keys(styles).length){lines.push("🎵 ESTILOS MUSICAIS DA BASE");Object.entries(styles).sort((a,b)=>b[1]-a[1]).forEach(([s,n])=>lines.push(s+": "+n+" clientes"));lines.push("");}
  if(churned.length){lines.push("⚠️ EM RISCO");churned.forEach(c=>lines.push(c.name+(c.phone?" 📱"+c.phone:"")+" — "+fmtDate(c.last)+" ("+c.away+"d), "+c.count+"x, "+fmt(c.tot)));lines.push("");}
  if(bdays.length){lines.push("🎂 ANIVERSÁRIOS PRÓXIMOS 30D");bdays.forEach(b=>lines.push(b));lines.push("");}
  lines.push("⚡ AÇÕES PRIORITÁRIAS");
  let n=1;
  churned.filter(c=>c.count>=3).slice(0,3).forEach(c=>{lines.push(n+". 🔴 "+c.name+(c.phone?" "+c.phone:"")+" — VIP sumiu há "+c.away+" dias");n++;});
  bdays.slice(0,3).forEach(b=>{lines.push(n+". 🔴 "+b+" — Enviar convite aniversário");n++;});
  churned.filter(c=>c.count>=2).filter(c=>!churned.filter(x=>x.count>=3).includes(c)).slice(0,3).forEach(c=>{lines.push(n+". 🟡 "+c.name+(c.phone?" "+c.phone:"")+" — Reativar, "+c.count+" visitas, sumiu "+c.away+"d");n++;});
  if(dayStats.length){const b=dayStats[0];lines.push(n+". 🟢 Reforçar divulgação para "+b[0]+" — melhor dia ("+b[1].v+" visitas, "+fmt(b[1].r)+")");}
  return lines.join("\n");
}

  w.document.close();
}

function TagRow({options,value,onChange}){

// ─── Bday Importer component ─────────────────────────────────────────────────
function BdayImporter({onImport}){
  const [step,setStep]=useState("idle");
  const [rows,setRows]=useState([]);
  const [headers,setHeaders]=useState([]);
  const [mapN,setMapN]=useState("");
  const [mapB,setMapB]=useState("");
  const [mapP,setMapP]=useState("");
  const [log,setLog]=useState("");
  const [err,setErr]=useState("");
  const ref=useRef();
  function readFile(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=evt=>{
      try{
        const wb=XLSX.read(evt.target.result,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const all=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        if(!all.length){setErr("Planilha vazia.");return;}
        let hIdx=0;
        for(let i=0;i<Math.min(10,all.length);i++){
          if(all[i].some(c=>String(c).toLowerCase().includes("nome")||String(c).toLowerCase().includes("nasc")||String(c).toLowerCase().includes("aniv"))){hIdx=i;break;}
        }
        const hdr=all[hIdx].map(String).filter(h=>h.trim());
        const objs=all.slice(hIdx+1).filter(r=>r.some(c=>String(c).trim())).map(r=>{const o={};hdr.forEach((h,i2)=>{o[h]=r[i2]!==undefined?r[i2]:"";});return o;});
        if(!objs.length){setErr("Nenhum dado.");return;}
        setRows(objs);setHeaders(hdr);
        const lh=hdr.map(h=>({o:h,l:h.toLowerCase()}));
        const find=(...t)=>lh.find(h=>t.some(x=>h.l.includes(x)))?.o||"";
        setMapN(find("nome","name","cliente"));
        setMapB(find("nasc","aniv","birthday","nascimento","birth"));
        setMapP(find("telefone","phone","celular","whatsapp","tel","fone"));
        setStep("map");setErr("");
      }catch(e){setErr("Erro: "+e.message);}
    };
    reader.readAsArrayBuffer(file);
  }
  function doImport(){
    if(!mapN){alert("Selecione a coluna de Nome.");return;}
    const contacts=rows.map(r=>{
      const name=String(r[mapN]||"").trim();if(!name)return null;
      const bday=mapB?normBday(r[mapB]):"";
      const phone=mapP?normPhone(String(r[mapP]||"").trim()):"";
      return{id:"bc_"+Math.random().toString(36).slice(2),name,bday,phone};
    }).filter(Boolean);
    onImport(contacts);setLog(contacts.length+" contatos importados");setStep("done");
  }
  if(step==="idle"||step==="done")return React.createElement("div",null,
    React.createElement(Card,{s:{textAlign:"center",padding:"24px 20px",marginBottom:10}},
      React.createElement("div",{style:{fontSize:28,marginBottom:10}},"🎂"),
      React.createElement("div",{style:{fontSize:13,color:"#8a7a58",marginBottom:6}},"Envie o Excel de aniversários"),
      React.createElement("div",{style:{fontSize:11,color:"#4a4030",marginBottom:16}},"Sem limite de linhas — lê tudo"),
      React.createElement("input",{ref,type:"file",accept:".xlsx,.xls,.csv",onChange:readFile,style:{display:"none"}}),
      React.createElement(GB,{onClick:()=>ref.current?.click()},"Escolher arquivo"),
      log&&React.createElement("div",{style:{marginTop:14,fontSize:12,color:"#6aaa6a",background:"#0f1a0f",border:"1px solid #2a4a2a",borderRadius:7,padding:"10px 14px"}},log),
      err&&React.createElement("div",{style:{marginTop:10,fontSize:11,color:"#aa4a4a"}},err)
    )
  );
  if(step==="map")return React.createElement("div",null,
    React.createElement(Card,{s:{marginBottom:12}},
      React.createElement(Lbl,null,"Mapear Colunas"),
      React.createElement("div",{style:{fontSize:11,color:"#5a5040",marginBottom:14}},rows.length+" linhas encontradas"),
      React.createElement("div",{style:{display:"grid",gap:10,marginBottom:14}},
        [["Nome *",mapN,setMapN],["Aniversário (DD/MM ou DD/MM/AAAA)",mapB,setMapB],["Telefone (opcional)",mapP,setMapP]].map(([l,v,set])=>
          React.createElement("div",{key:l,style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,alignItems:"center"}},
            React.createElement("div",{style:{fontSize:11,color:"#c8a030",fontFamily:"Georgia,serif"}},l),
            React.createElement("select",{value:v,onChange:e=>set(e.target.value),style:{background:"#0f0f0f",border:"1px solid #222",borderRadius:7,padding:"8px 10px",color:"#e8e0d0",fontSize:12,fontFamily:"Georgia,serif",outline:"none"}},
              React.createElement("option",{value:""},"— Não mapear —"),
              ...headers.map(h=>React.createElement("option",{key:h,value:h},h))
            )
          )
        )
      ),
      mapN&&React.createElement("div",{style:{marginBottom:14}},
        React.createElement("div",{style:{fontSize:9,letterSpacing:2,color:"#5a4828",textTransform:"uppercase",marginBottom:8,fontFamily:"Georgia,serif"}},"Preview"),
        rows.slice(0,4).map((r,i)=>{const n=String(r[mapN]||"").trim();const b=mapB?normBday(r[mapB]):"";const p=mapP?normPhone(String(r[mapP]||"").trim()):"";return n?React.createElement("div",{key:i,style:{fontSize:11,color:"#8a7a58",padding:"4px 0",borderBottom:"1px solid #181818"}},n+(b?" · 🎂 "+fmtBday(b):"")+(p?" · 📱":"")):"";})
      )
    ),
    React.createElement(GB,{onClick:doImport,s:{marginBottom:8}},"Confirmar e importar "+rows.length+" contatos"),
    React.createElement(GH,{onClick:()=>{setStep("idle");if(ref.current)ref.current.value="";}},"Cancelar")
  );
  return null;
}

// ─── Called tracking ──────────────────────────────────────────────────────────
function getWeekKey(){const d=new Date();const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));return mon.toISOString().slice(0,10);}
function getCalledKey(promoter){return "mahau_called_"+promoter+"_"+getWeekKey();}
function loadCalled(promoter){try{return JSON.parse(localStorage.getItem(getCalledKey(promoter))||"[]");}catch{return[];}}
function saveCalled(promoter,ids){try{localStorage.setItem(getCalledKey(promoter),JSON.stringify(ids));}catch{}}

// ─── Promoters ────────────────────────────────────────────────────────────────
const PROMOTERS=["Ygor","Matheus","Mahau","Aretha"];
const PROMOTER_COLORS={"Ygor":"#b8860b","Matheus":"#2a7a5a","Mahau":"#6a3a9a","Aretha":"#9a3a6a"};
function getPromoter(id){
  if(!id)return PROMOTERS[0];
  let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%4;
  return PROMOTERS[h];
}

                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span onClick={()=>{setSelId(c.id);setView("perfil");}} style={{fontSize:13,color:"#f0e0b0",fontWeight:600,cursor:"pointer",textDecoration:"underline"}}>{c.name}</span>
                    <Bdg segment={c.segment} color={c.color}/>
                    <WaBtn phone={c.phone}/>
                  </div>
                  <div style={{fontSize:11,color:"#6a5030"}}>
                    Vinha a cada <b style={{color:"#c8a030"}}>{c.avgInterval}d</b> · ausente <b style={{color:"#c87828"}}>{c.daysSince}d</b> · <b style={{color:"#aa4a2a"}}>{c.daysOverdue}d atrasado</b>
                  </div>
                </div>
                <div style={{textAlign:"right",marginLeft:10}}>
                  <div style={{fontSize:12,color:"#c8a030",fontWeight:600}}>{fmt(c.total)}</div>
                </div>
              </div>
            </div>)}
          </div>}

          {naHora.length>0&&<div style={{marginBottom:16}}>
            <div style={{fontSize:9,letterSpacing:2,color:"#4a8a4a",textTransform:"uppercase",marginBottom:10,fontFamily:"Georgia,serif"}}>🟢 Deve voltar em breve ({naHora.length})</div>
            {naHora.map(c=><div key={c.id} style={{background:"#0f0f0f",border:"1px solid #1a2a1a",borderRadius:9,padding:"12px 16px",marginBottom:7}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span onClick={()=>{setSelId(c.id);setView("perfil");}} style={{fontSize:13,color:"#d0f0c8",fontWeight:600,cursor:"pointer",textDecoration:"underline"}}>{c.name}</span>
                    <WaBtn phone={c.phone}/>
                  </div>
                  <div style={{fontSize:11,color:"#4a6a4a"}}>
                    Vinha a cada <b style={{color:"#c8a030"}}>{c.avgInterval}d</b> · ausente {c.daysSince}d · deve voltar em breve
                  </div>
                </div>
                <div style={{fontSize:12,color:"#c8a030",fontWeight:600,marginLeft:10}}>{fmt(c.total)}</div>
              </div>
            </div>)}
          </div>}

          {predictions.length===0&&<Card><div style={{textAlign:"center",padding:"24px",color:"#3a3a3a",fontSize:13}}>Precisa de pelo menos 2 visitas por cliente para calcular predição.<br/>Continue alimentando a base.</div></Card>}
        </div>;
      })()}
    </div>}

    {/* PERFORMANCE */}
    {view==="performance"&&isAdmin&&<div>
      <Lbl>📊 Performance dos Promoters</Lbl>
      {(()=>{
        const logs=data.waLogs||[];
        const cut7=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
        const cut30=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
        const logsWeek=logs.filter(l=>l.date>=cut7);
        const logs30=logs.filter(l=>l.date>=cut30);
        const hoje=new Date().toISOString().slice(0,10);
        const logsHoje=logs.filter(l=>l.date===hoje);

        function StatBlock({title,logsSet}){
          return<Card s={{marginBottom:12}}>
            <div style={{fontSize:9,letterSpacing:3,color:"#6a5020",textTransform:"uppercase",marginBottom:12,fontFamily:"Georgia,serif"}}>{title}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
              {PROMOTERS.map(p=>{
                const n=logsSet.filter(l=>l.promoter===p).length;
                const pc=PROMOTER_COLORS[p];
                return<div key={p} style={{background:"#0a0a08",borderRadius:8,padding:"10px 8px",textAlign:"center"}}>
                  <div style={{fontSize:11,color:pc,fontWeight:700,marginBottom:2}}>{p}</div>
                  <div style={{fontSize:22,color:pc,fontWeight:700}}>{n}</div>
                  <div style={{fontSize:9,color:"#4a4028"}}>clique{n!==1?"s":""}</div>
                </div>;
              })}
            </div>
            {PROMOTERS.map(p=>{
              const mine=logsSet.filter(l=>l.promoter===p).sort((a,b)=>b.ts.localeCompare(a.ts));
              if(!mine.length)return null;
              const pc=PROMOTER_COLORS[p];
              return<div key={p} style={{marginBottom:12}}>
                <div style={{fontSize:10,color:pc,letterSpacing:2,textTransform:"uppercase",marginBottom:6,fontFamily:"Georgia,serif"}}>{p} — {mine.length} chamada{mine.length!==1?"s":""}</div>
                {mine.slice(0,10).map((l,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #111"}}>
                  <div style={{fontSize:12,color:"#b0a080"}}>{l.clientName}</div>
                  <div style={{fontSize:10,color:"#4a4028"}}>{new Date(l.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} {l.date!==hoje?"· "+l.date.slice(5).split("-").reverse().join("/"):""}</div>
                </div>)}
                {mine.length>10&&<div style={{fontSize:10,color:"#3a3a3a",textAlign:"center",padding:"4px"}}>+{mine.length-10} mais</div>}
              </div>;
            })}
          </Card>;
        }

        return<div>
          <StatBlock title="Hoje" logsSet={logsHoje}/>
          <StatBlock title="Últimos 7 dias" logsSet={logsWeek}/>
          <StatBlock title="Últimos 30 dias" logsSet={logs30}/>
          {logs.length===0&&<Card><div style={{textAlign:"center",padding:"24px",color:"#3a3a3a",fontSize:13}}>Nenhum clique registrado ainda.<br/>Os dados aparecem assim que os promoters começarem a usar o Brief.</div></Card>}
        </div>;
      })()}
    </div>}

    </div>
  </div>);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
